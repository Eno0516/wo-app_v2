get:
  summary: Get furrow Info
  parameters:
    - name: farmUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: farmManageUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Farm page info
      content:
        application/json:
          schema:
            $ref: '../schema/furrowBasicInfo.yaml#/FurrowBasicInfo' 
put:
  summary: Update Farm FarmInfo
  parameters:
    - name: farmUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: farmManageUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schema/manageFarm.yaml#/FarmInfoDetail'
  responses:
    '200':
      description: OK