FarmPageBasicInfo:
  type: object
  required:
    - farmName
    - farmYear
    - farmSeasons
    - farmManageUuid
  properties:
    farmName: 
      type: string
    farmYear:
      type: integer
      format: int32
    farmSeasons:
      type: array
      items:
        type: integer
        format: int32
    farmManageUuid:
      type: string
      format: uuid